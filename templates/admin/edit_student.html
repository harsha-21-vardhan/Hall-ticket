{% extends "base.html" %}

{% block title %}Edit Student - Smart Hall Ticket System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-warning text-white">
                    <h4 class="mb-0"><i class="fas fa-edit"></i> Edit Student</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" name="name" value="{{ student.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" value="{{ student.email }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Register Number</label>
                            <input type="text" class="form-control" name="register_number" value="{{ student.register_number }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password (leave blank to keep current)</label>
                            <input type="password" class="form-control" name="password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select class="form-select" name="department" required>
                                <option value="CSE" {% if student.department == 'CSE' %}selected{% endif %}>CSE</option>
                                <option value="ECE" {% if student.department == 'ECE' %}selected{% endif %}>ECE</option>
                                <option value="EEE" {% if student.department == 'EEE' %}selected{% endif %}>EEE</option>
                                <option value="MECH" {% if student.department == 'MECH' %}selected{% endif %}>MECH</option>
                                <option value="CIVIL" {% if student.department == 'CIVIL' %}selected{% endif %}>CIVIL</option>
                                <option value="IT" {% if student.department == 'IT' %}selected{% endif %}>IT</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning">Update Student</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
